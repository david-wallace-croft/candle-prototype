[package]
authors = ["David Wallace Croft <david@CroftSoft.com>"]
description = "Hugging Face Candle Prototype"
edition = "2024"
homepage = "https://www.CroftSoft.com/"
license = "MIT"
name = "candle-prototype"
publish = false
readme = "README.md"
repository = "https://github.com/david-wallace-croft/candle-prototype"
rust-version = "1.98.1"
version = "0.0.0-SNAPSHOT"

[dependencies]
# none

[profile.dev]
debug = "line-tables-only"

[workspace]
members = ["prototype-00", "prototype-01"]

[workspace.dependencies]
anyhow = "1.0.104"
candle-core = { git = "https://github.com/huggingface/candle.git" }
candle-examples = { git = "https://github.com/huggingface/candle.git" }
candle-nn = { git = "https://github.com/huggingface/candle.git" }
candle-transformers = { git = "https://github.com/huggingface/candle.git" }
clap = { version = "4.2.4", features = ["derive"] }
